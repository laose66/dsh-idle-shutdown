- insert:
    - id: idle-shutdown
      name: dsh-idle-shutdown
      config:
        # Master switch for the entry itself. false unloads the monitor and its UI.
        enabled: true
        # Title-bar switch: on = inside a window, idle for idleMinutes -> shut down.
        armed: true
        # Whitelist windows ("HH:MM"). The shutdown may only fire inside one of
        # them; an end earlier than its start crosses midnight. No window at all
        # means all day.
        windows:
          - start: '23:00'
            end: '07:00'
        # Idle time before the countdown starts. Fractions are allowed
        # (0.5 = 30 s); the minimum is 0.05 (3 s, for testing), the maximum 180.
        idleMinutes: 30
        # Countdown before the shutdown. It stays cancellable right up to the
        # last closeLeadSeconds, and any new conversation activity cancels it.
        warningSeconds: 60
        # How often the whole conversation tree is inspected (safety net only).
        tickSeconds: 15
        # How long a turn that waits for the user (pending approval/question)
        # keeps blocking once its Session stops committing events.
        waitingGraceMinutes: 10
        # The last seconds of the countdown, owned by `shutdown /s /t <n>`.
        # Range 3-60; from these seconds on the action can no longer be undone.
        closeLeadSeconds: 3
        # true logs the decision and writes the status file without touching the OS.
        dryRun: false
        # Persistent files: the status file is rewritten in place, and the
        # durable log may take at most logMaxFiles rotated generations of at
        # most logMaxKB each; the oldest generation is dropped first.
        logMaxKB: 256
        logMaxFiles: 3
        # Atomic-write leftovers (state.json.<pid>.tmp) older than this are
        # removed on startup.
        tempMaxAgeMinutes: 60
        # Optional status-file path; empty uses the system temp directory.
        stateFile: ''